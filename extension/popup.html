<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switch FAANG</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #111118;
      color: #e5e5e5;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a2a3a;
    }
    .header h1 { font-size: 15px; font-weight: 700; }
    .header span { font-size: 10px; color: #888; }
    .mode-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #10b981;
      text-align: center;
      margin-bottom: 8px;
      font-weight: 600;
    }
    .status { padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 12px; }
    .status.warning { background: #1a1a0a; border: 1px solid #f59e0b22; color: #fbbf24; }
    .form-group { margin-bottom: 8px; }
    .form-group label { display: block; font-size: 10px; color: #888; margin-bottom: 3px; font-weight: 500; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid #2a2a3a;
      background: #0a0a14;
      color: #eee;
      font-size: 12px;
      outline: none;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: #10b981; }
    .form-group textarea { resize: vertical; min-height: 50px; font-family: monospace; font-size: 11px; }
    .form-group select { appearance: none; -webkit-appearance: none; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    button {
      width: 100%;
      padding: 9px 16px;
      border-radius: 7px;
      border: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    button.primary { background: linear-gradient(135deg, #10b981, #0d9488); color: white; }
    button.primary:hover { opacity: 0.9; }
    button.primary:disabled { background: #333; color: #666; cursor: not-allowed; }
    button.secondary { background: transparent; color: #888; border: 1px solid #2a2a3a; margin-top: 6px; font-size: 11px; }
    button.secondary:hover { border-color: #444; color: #e5e5e5; }
    .settings { margin-top: 10px; padding-top: 10px; border-top: 1px solid #2a2a3a; }
    .settings label { font-size: 10px; color: #666; display: block; margin-bottom: 3px; }
    .settings input {
      width: 100%;
      padding: 6px 8px;
      border-radius: 5px;
      border: 1px solid #2a2a3a;
      background: #0a0a14;
      color: #eee;
      font-size: 11px;
    }
    .result { margin-top: 8px; font-size: 11px; text-align: center; }
    .hint { font-size: 9px; color: #666; margin-top: 2px; }

    /* Jobs mode */
    .job-count { font-size: 22px; font-weight: 700; text-align: center; margin: 8px 0 2px; }
    .job-label { font-size: 11px; color: #888; text-align: center; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Switch FAANG</h1>
    <span>LinkedIn Helper</span>
  </div>

  <!-- Not on LinkedIn -->
  <div id="not-linkedin" class="status warning" style="display:none;">
    Navigate to LinkedIn Jobs or a LinkedIn Profile to use this extension.
  </div>

  <!-- Jobs Mode -->
  <div id="jobs-mode" style="display:none;">
    <div class="mode-label">JOBS MODE</div>
    <div class="job-count" id="job-count">—</div>
    <div class="job-label">jobs found on this page</div>
    <button class="primary" id="save-jobs-btn" disabled>Save to Switch FAANG</button>
    <div id="jobs-result" class="result" style="display:none;"></div>
  </div>

  <!-- Profile/Contact Mode — Always shows an editable form -->
  <div id="profile-mode" style="display:none;">
    <div class="mode-label">CONTACT MODE</div>
    
    <div class="row">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="contact-name" placeholder="Full name" />
      </div>
      <div class="form-group">
        <label>Company</label>
        <input type="text" id="contact-company" placeholder="Company" />
      </div>
    </div>

    <div class="form-group">
      <label>Title</label>
      <input type="text" id="contact-title" placeholder="Job title" />
    </div>

    <div class="form-group">
      <label>Emails (paste from ContactOut/SignalHire)</label>
      <textarea id="contact-emails" placeholder="one@company.com&#10;two@gmail.com"></textarea>
      <p class="hint">Comma or newline separated. Copy from your email tool and paste here.</p>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Role</label>
        <select id="contact-role">
          <option value="Recruiter">Recruiter</option>
          <option value="Software Developer">Software Dev</option>
          <option value="Engineering Manager">Eng Manager</option>
          <option value="Hiring Manager">Hiring Manager</option>
          <option value="Director">Director</option>
          <option value="VP">VP</option>
          <option value="Talent Sourcer">Talent Sourcer</option>
          <option value="Other">Other</option>
        </select>
      </div>
    </div>

    <button class="primary" id="save-contact-btn">Save Contact to Switch FAANG</button>
    <div id="profile-result" class="result" style="display:none;"></div>
  </div>

  <!-- Settings -->
  <div class="settings">
    <label>API URL (your Switch FAANG instance)</label>
    <input type="text" id="api-url" placeholder="https://switch-faang.vercel.app" />
    <button class="secondary" id="save-settings">Save Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
