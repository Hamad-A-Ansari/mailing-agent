<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switch FAANG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      width: 320px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e5e5e5;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #333;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
    }
    .header span {
      font-size: 11px;
      color: #888;
    }
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 13px;
    }
    .status.info {
      background: #1e3a5f;
      border: 1px solid #2563eb33;
    }
    .status.success {
      background: #1a3a2a;
      border: 1px solid #22c55e33;
      color: #4ade80;
    }
    .status.error {
      background: #3a1a1a;
      border: 1px solid #ef444433;
      color: #f87171;
    }
    .status.warning {
      background: #3a2a1a;
      border: 1px solid #f59e0b33;
      color: #fbbf24;
    }
    .job-count {
      font-size: 24px;
      font-weight: 700;
      text-align: center;
      margin: 16px 0 8px;
    }
    .job-label {
      font-size: 12px;
      color: #888;
      text-align: center;
      margin-bottom: 16px;
    }
    button {
      width: 100%;
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    button.primary {
      background: #fff;
      color: #000;
    }
    button.primary:hover {
      background: #e5e5e5;
    }
    button.primary:disabled {
      background: #444;
      color: #888;
      cursor: not-allowed;
    }
    button.secondary {
      background: transparent;
      color: #888;
      border: 1px solid #333;
      margin-top: 8px;
    }
    button.secondary:hover {
      border-color: #555;
      color: #e5e5e5;
    }
    .settings {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #333;
    }
    .settings label {
      font-size: 11px;
      color: #888;
      display: block;
      margin-bottom: 4px;
    }
    .settings input {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #222;
      color: #e5e5e5;
      font-size: 12px;
    }
    .settings input:focus {
      outline: none;
      border-color: #555;
    }
    .result {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Switch FAANG</h1>
    <span>LinkedIn Job Saver</span>
  </div>

  <div id="not-linkedin" class="status warning" style="display:none;">
    Navigate to LinkedIn Jobs search to use this extension.
  </div>

  <div id="main" style="display:none;">
    <div class="job-count" id="job-count">—</div>
    <div class="job-label">jobs found on this page</div>

    <button class="primary" id="save-btn" disabled>Save to Switch FAANG</button>

    <div id="result" class="result" style="display:none;"></div>
  </div>

  <div class="settings" id="settings">
    <label>API URL (your Switch FAANG instance)</label>
    <input type="text" id="api-url" placeholder="https://switch-faang.vercel.app" />
    <button class="secondary" id="save-settings" style="margin-top: 8px;">Save Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
