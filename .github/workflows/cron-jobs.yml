name: Scheduled Cron Jobs

on:
  schedule:
    # Check replies every 5 minutes
    - cron: '*/5 * * * *'
    # Send follow-ups every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  check-replies:
    if: github.event.schedule == '*/5 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reply sync
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "ERROR: APP_URL secret is not set"
            exit 1
          fi
          STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/check-replies")
          echo "HTTP $STATUS"
          cat /tmp/response.txt
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: expected 200, got $STATUS"
            exit 1
          fi

  send-follow-ups:
    if: github.event.schedule == '*/15 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger follow-up send
        run: |
          if [ -z "${{ secrets.APP_URL }}" ]; then
            echo "ERROR: APP_URL secret is not set"
            exit 1
          fi
          STATUS=$(curl -s -o /tmp/response.txt -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/follow-ups/send")
          echo "HTTP $STATUS"
          cat /tmp/response.txt
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: expected 200, got $STATUS"
            exit 1
          fi
